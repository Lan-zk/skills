<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Trending Card</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .card-container {
      width: 800px;
      background: linear-gradient(135deg, #1e1e2f 0%, #151522 100%);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      color: #ffffff;
      box-sizing: border-box;
      border: 1px solid #30363d;
    }
    
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .repo-icon {
      width: 24px;
      height: 24px;
      fill: #8b949e;
      margin-right: 12px;
    }
    
    .repo-name {
      font-size: 28px;
      font-weight: 700;
      color: #58a6ff;
      word-break: break-all;
    }
    
    .repo-desc {
      font-size: 18px;
      color: #8b949e;
      line-height: 1.5;
      margin-bottom: 24px;
      min-height: 54px;
    }
    
    .footer {
      display: flex;
      align-items: center;
      font-size: 16px;
      color: #8b949e;
    }
    
    .repo-lang {
      display: flex;
      align-items: center;
      margin-right: 24px;
    }
    
    .lang-color {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      margin-right: 8px;
    }
    
    .repo-stars-total, .repo-stars-new {
      display: flex;
      align-items: center;
      margin-right: 24px;
    }
    
    .star-icon {
      width: 18px;
      height: 18px;
      fill: #8b949e;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="card-container">
    <div class="header">
      <svg class="repo-icon" viewBox="0 0 16 16" version="1.1" aria-hidden="true">
        <path fill-rule="evenodd" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"></path>
      </svg>
      <div class="repo-name">{{name}}</div>
    </div>
    
    <div class="repo-desc">{{description}}</div>
    
    <div class="footer">
      <div class="repo-lang">
        <span class="lang-color" style="background-color: {{hex}};"></span>
        <span>{{language}}</span>
      </div>
      
      <div class="repo-stars-total">
        <svg class="star-icon" viewBox="0 0 16 16" version="1.1" aria-hidden="true">
          <path fill-rule="evenodd" d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.312a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.311L7.327.668A.75.75 0 018 .25zm0 2.445L6.615 5.5a.75.75 0 01-.564.41l-3.097.23 2.24 2.184a.75.75 0 01.216.664l-.528 3.084 2.769-1.456a.75.75 0 01.698 0l2.77 1.456-.53-3.084a.75.75 0 01.216-.664l2.24-2.183-3.096-.23a.75.75 0 01-.564-.41L8 2.694v.001z"></path>
        </svg>
        <span>{{stars}}</span>
      </div>
      
      <div class="repo-stars-new">
        <svg class="star-icon" viewBox="0 0 16 16" version="1.1" aria-hidden="true">
          <path fill-rule="evenodd" d="M8 1.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13zM0 8a8 8 0 1116 0A8 8 0 010 8zm11.646-2.646a.5.5 0 01.708.708l-5 5a.5.5 0 01-.708 0l-2.5-2.5a.5.5 0 11.708-.708L7 10.293l4.646-4.647z"></path>
        </svg>
        <span>{{new_stars}} stars today</span>
      </div>
    </div>
  </div>
</body>
</html>
